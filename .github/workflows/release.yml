# Builds the installers for Windows, macOS and Linux and publishes them in a
# GitHub Release when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual run: builds and keeps the files as workflow artifacts only

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The tag decides the version: v1.2.3 -> 1.2.3
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code signing (no certificates)

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Terminal-only version: the scripts plus the Docker files they need.
      - name: Package the command-line version
        run: |
          mkdir -p cli/onlyroute
          cp onlyroute.ps1 onlyroute.sh Dockerfile entrypoint.sh vpns.example.json onlyroute.env.example README.md README.pt-BR.md LICENSE cli/onlyroute/
          chmod +x cli/onlyroute/onlyroute.sh
          cd cli && zip -r "../OnlyRoute-${GITHUB_REF_NAME#v}-cli.zip" onlyroute

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        run: |
          mv OnlyRoute-*-cli.zip installers/
          cd installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
