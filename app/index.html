<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>OnlyRoute</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #667080; --line: #e3e6ea;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --soft: #eef2f7; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1f2227; --text: #e8eaed; --muted: #9aa3ae; --line: #30343b;
      --accent: #4f8cff; --soft: #262a31; --input: #16181c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 20px 12px; display: flex; align-items: center; gap: 10px; min-height: 62px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--bad); }
  main { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
  footer { padding: 10px 20px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  button.small { padding: 5px 12px; font-size: 13px; color: var(--muted); }
  button.small:hover { color: var(--text); }
  button.lang { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 9px; }
  button.lang svg { margin-right: 5px; }
  button.lang .seg { padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: .3px; }
  button.lang .seg:hover { color: var(--text); }
  button.lang .seg.on { background: var(--accent); color: var(--accent-text); }
  button.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.danger-fill:hover { filter: brightness(1.08); }

  /* Confirmation dialog (instead of the system's confirm box) */
  .modal-wrap {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0, 0, 0, .45); animation: fade .12s ease-out;
  }
  .modal {
    width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; box-shadow: 0 16px 48px rgba(0, 0, 0, .35); animation: pop .14s ease-out;
  }
  .modal-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .modal-text { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal button:focus-visible { outline: 2px solid color-mix(in srgb, var(--text) 35%, transparent); outline-offset: 2px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .card.active { border-color: var(--accent); }
  .card[data-edit] { cursor: default; user-select: none; }
  .card[data-edit]:hover { border-color: var(--muted); }
  .card.active[data-edit]:hover { border-color: var(--accent); }
  .row { display: flex; align-items: flex-start; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  /* Save/Cancel/Delete bar of the form: always visible at the bottom while the form scrolls. */
  .formbar {
    position: sticky; bottom: -16px; z-index: 2; align-items: center;
    margin: 8px -20px -16px; padding: 12px 20px 16px;
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { background: var(--soft); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .msg { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .err { white-space: pre-wrap; font-size: 12.5px; color: var(--bad); background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; max-height: 180px; overflow: auto; }
  .good { color: var(--ok); font-weight: 600; }

  button {
    font: inherit; border-radius: 8px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .icon { border: none; background: none; padding: 4px 6px; color: var(--muted); }
  .link { border: none; background: none; padding: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; }
  .link:hover { color: var(--text); }

  input, textarea {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--input); color: var(--text);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 84px; }
  label { display: block; margin-bottom: 12px; }
  label > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .two { display: flex; gap: 10px; } .two > :first-child { flex: 1; } .two > :last-child { width: 100px; }
  .inline { display: flex; gap: 8px; } .inline input { flex: 1; }
  .code { letter-spacing: 4px; font-size: 15px; text-align: center; padding: 0 10px; height: 32px; }
  .code:focus { outline-width: 1px; border-color: var(--accent); }
  .codebar { align-items: center; }
  .codebar > button { height: 32px; padding: 0 14px; }
  .codebox { position: relative; flex: 0 0 190px; }
  .codebox .code { padding: 0 34px; }
  .codebox .paste { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; }
  .codebox .paste:hover { color: var(--text); }
  .inline input.code { flex: 0 0 170px; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .check input { width: auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }

  .notice { background: var(--soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .notice .grow { white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; flex: none; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  a.site-link { cursor: pointer; text-decoration: none; }
  a.site-link:hover { color: var(--accent); text-decoration: underline; }
  .chip.pending { color: var(--warn); border: 1px dashed var(--warn); background: transparent; }
  .notice.warn { border: 1px solid var(--warn); align-items: flex-start; }
  .notice.warn .grow { white-space: normal; }
  .pend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; font-family: Consolas, monospace; font-size: 12.5px; }
  .field { margin-bottom: 12px; }
  .lbl { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .sites { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .site { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-top: 1px solid var(--line); background: var(--input); }
  .site:first-child { border-top: none; }
  .site.muted { color: var(--muted); padding: 10px 12px; }
  .badge { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; }
  .badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .badge.pend { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .badge.new { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 4px; margin-bottom: 12px; }
  .box-title { font-weight: 600; font-size: 13px; margin-bottom: 12px; }
  .box-title .count { color: var(--muted); font-weight: 400; }
  .box .sites, .box .inline, .box > .hint { margin-bottom: 10px; }
  .adv summary { margin-bottom: 10px; }
  .site .icon:hover { color: var(--bad); }

  .pwbox { position: relative; flex: 1; }
  .pwbox input { padding-right: 40px; }
  .pwbox .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; }
  .pwbox .eye:hover { color: var(--text); }

  .box .hint + .sites { margin-top: 10px; }

  /* Thin, rounded scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-button { display: none; }
  main { scrollbar-gutter: stable; }
</style>
</head>
<body>
  <header>
    <div class="status grow" style="margin-top:0"><span class="dot" id="dot"></span><span id="statusText">Verificando...</span></div>
    <button class="primary" id="addBtn">+ Adicionar VPN</button>
  </header>
  <main id="main"></main>
  <footer id="footer">
    <button class="small lang" id="langBtn"></button>
    <span class="grow"></span>
    <button class="small" id="importBtn" title="Trazer as VPNs do vpns.json do script">Importar VPNs</button>
    <button class="small" id="hostsBtn" title="Tirar as linhas do OnlyRoute do arquivo hosts do Windows">Limpar hosts</button>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
